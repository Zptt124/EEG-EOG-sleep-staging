# 第一周历史协议模板：第二周公共规则见 docs/week2/protocol_v2.md。
# 没有实现绑定，不可视为已经可以运行的训练配置。
status: draft_requires_team_review
dataset: sleep_edf_expanded_sc
channels:
  eeg: EEG Fpz-Cz
  eog: EOG horizontal
baseline_sfreq_hz: 100
epoch_seconds: 30
labels: {W: 0, N1: 1, N2: 2, N3: 3, REM: 4}
split:
  unit: subject
  proportions: [0.70, 0.10, 0.20]
  seed: 42 # A 的 v1 划分(2026-10-18)
  manifest: manifests/split_subjects.csv
preprocessing:
  wake_margin_minutes: 30
  sleep_boundary_definition: null # A明确首次/末次睡眠与边界处理
  merge_stage_3_4: true
  exclude: [Movement, Unknown]
  normalization_fit_split: train
training:
  seed: null
  label_subject_fraction: 1.0   # 25% 档为 0.25,见 manifests/label_subsets_v1.csv
  sampling_seed: 2024           # B:标签名单抽样种子(与训练 seed 分开)
  label_subsets_manifest: manifests/label_subsets_v1.csv
  checkpoint_selection: val_macro_f1
analysis_split: val
test_policy: held_out_in_week1
eegdm:
  freeze_backbone: true
  input_adapter: null # C核对官方实现后填写，不沿用CNN归一化假设
  channel_condition: null
  checkpoint_hash: null
